[workspace]
resolver = "2"
members = [
    "build",
    "common",
    "proto",
    "cfgsv",
    "loginsv",
    "services/aki-logic",
    "gamesv/data",
    "gamesv/fs",
    "gamesv/logic",
    "gamesv",
]

[workspace.package]
version = "0.1.4"
edition = "2024"

[workspace.dependencies]
aes = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
crc32fast = "1.5"
getrandom = "0.3"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
codegen-units = 8

[profile.test]
debug = 0
codegen-units = 8

[profile.release]
opt-level = 3
lto = false
codegen-units = 4
strip = true
